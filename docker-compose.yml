services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "python migrate.py && exec uvicorn api:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/f1_races.db
    volumes:
      - race-data:/app/data
      - race-cache:/app/cache

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  race-data:
  race-cache:
